name: Check commits
"on":
  push:
    branches:
      - "**"
      - "!no-tests/**"
    tags:
      - "!**"
  pull_request:
    branches:
      - "**"
      - "!no-tests/**"
env:
  NODE_VERSION: "24.x"
jobs:
  check-modules:
    name: Check Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check whether or not necessary modules are installed.
        run: ./utils/check-necessary-modules
      - name: Check whether or not unnecessary modules are installed.
        run: ./utils/check-unnecessary-modules
  check-scripts:
    name: Check Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install modules
        run: npm install
      - name: Lint scripts
        run: npm run lint
      - name: Check transpilation
        run: |
          npm run build
          git diff --exit-code -- ./lib
  smoke-test:
    name: Smoke Test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Smoke Test on ${{ matrix.os }}
        run: |
          npm install
          npm run smoke-test
