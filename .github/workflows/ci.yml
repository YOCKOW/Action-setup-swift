name: Workflow Test
"on":
  push:
    branches:
      - "**"
      - "!no-tests/**"
    tags:
      - "!**"
  pull_request:
    branches:
      - "**"
      - "!no-tests/**"
jobs:
  branch-test:
    name: Test with `swift-version` input.
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-26
        swift-installer:
          - swiftenv
          - swiftly
        swift-version:
          - "6.3.3"
          - DEVELOPMENT-SNAPSHOT-2026-08-21-a
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Swift ${{ matrix.swift-version }} using ${{ matrix.swift-installer }}.
        uses: ./
        with:
          swift-installer: ${{ matrix.swift-installer }}
          swift-version: ${{ matrix.swift-version }}
      - name: View Swift Version
        run: swift --version
      - name: Run Swift
        run: ./utils/swift-test
      - name: Test clang
        run: ./utils/clang-test
  branch-test-with-swift-version-file:
    name: Test with ".swift-version" file.
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-26
        swift-installer:
          - swiftenv
          - swiftly
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Swift using ${{ matrix.swift-installer }}.
        uses: ./
        with:
          swift-installer: ${{ matrix.swift-installer }}
          swift-package-directory: ./swift-test-package
      - name: View Swift Version
        run: swift --version
      - name: Run Swift
        run: ./utils/swift-test
